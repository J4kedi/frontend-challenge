    <!-- LCP art (Emerald Ape #042): desktop hero image, and the first catalog card on mobile.
         Same srcset/sizes as the <img> elements, so the browser reuses the preloaded file. -->
    <link rel="preload" as="image" type="image/avif" media="(min-width: 768px)" imagesrcset="/images/nfts/emerald-360.avif 360w, /images/nfts/emerald-720.avif 720w, /images/nfts/emerald-1080.avif 1080w" imagesizes="450px" fetchpriority="high" />
    <link rel="preload" as="image" type="image/avif" media="(max-width: 767px)" imagesrcset="/images/nfts/emerald-360.avif 360w, /images/nfts/emerald-720.avif 720w, /images/nfts/emerald-1080.avif 1080w" imagesizes="45vw" fetchpriority="high" />
  </head>

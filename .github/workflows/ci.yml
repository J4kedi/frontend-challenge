name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate the Linux visual baselines and upload them as an artifact
        type: boolean
        default: false
      lighthouse-origin:
        description: Audit this URL (e.g. the published demo) instead of a local build
        type: string
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build

  e2e:
    name: E2E and visual regression (Chromium, desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Same image that produced the visual baselines (scripts/visual-baselines.sh),
    # so font rasterization matches pixel for pixel.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Playwright
        run: pnpm test:e2e ${{ inputs.update-snapshots && '--update-snapshots' || '' }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload visual baselines
        if: ${{ inputs.update-snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__

  lighthouse:
    name: Lighthouse (demo build, 3 runs per page and profile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds, serves with vite preview and audits; the runner's Chrome is used.
      - run: pnpm lighthouse
        env:
          LH_ORIGIN: ${{ inputs.lighthouse-origin }}
      - run: cat reports/lighthouse/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: reports/lighthouse
          retention-days: 14
